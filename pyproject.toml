[build-system]
requires = ["hatchling>=1.26", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "py-mir-toolbox"
dynamic = ["version"]
description = "A Python port of MIRtoolbox for music feature extraction, designed as a bridge from music psychology to the Python MIR ecosystem."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "NOTICE", "reference/miningsuite/LICENSE.txt"]
requires-python = ">=3.12"
authors = [{ name = "Juan Sebastián Gómez-Cañón" }]
keywords = ["music", "audio", "MIR", "music information retrieval", "music psychology", "MIRtoolbox", "feature extraction"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
librosa = ["librosa>=1.0"]
parallel = ["joblib>=1.3"]
export = ["pandas>=2.2"]

[project.urls]
Homepage = "https://ccrma.stanford.edu/~jsgomezc/py-mir-toolbox"
Documentation = "https://ccrma.stanford.edu/~jsgomezc/py-mir-toolbox"
Source = "https://github.com/juansgomez87/py-mir-toolbox"
Issues = "https://github.com/juansgomez87/py-mir-toolbox/issues"

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=5", "pandas>=2.2", "joblib>=1.3"]
docs = [
    "sphinx>=8",
    "pydata-sphinx-theme>=0.16",
    "myst-nb>=1.1",
    "numpydoc>=1.8",
    "sphinx-design>=0.6",
    "sphinx-copybutton>=0.5",
    # Run by the course notebooks; never package dependencies (plan §6).
    "librosa>=1.0",
    "pandas>=2.2",
    # Pinned: later dev releases ship cp314 wheels only.
    "essentia==2.1b6.dev1389; sys_platform != 'win32' and python_version < '3.14'",
]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
    "ruff>=0.8",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/mirpy/_version.py"

[tool.hatch.build.targets.sdist]
exclude = ["reference/MIRtoolbox1.8.2", "drafts", "validation/fixtures", "docs/_build"]

[tool.hatch.build.targets.wheel]
packages = ["src/mirpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 99
target-version = "py312"
extend-exclude = ["src/mirpy/_vendor"]  # third-party code kept verbatim

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"validation/*" = ["D"]
"src/mirpy/_cite.py" = ["E501"]  # one BibTeX field per line
